            <text class="axis-label" x="487" y="432" text-anchor="middle">0.8</text>
            <text class="axis-label" x="595" y="432" text-anchor="middle">1.2</text>
            <text class="axis-label" x="703" y="432" text-anchor="middle">1.6</text>

            <text class="chart-label" x="0" y="80">deploy / gotcha</text>
            <text class="chart-sub" x="0" y="98">Redis on 6379; start docker compose</text>
            <rect class="bar-score" x="270" y="108" width="422" height="22" rx="2"></rect>
            <text class="chart-value" x="684" y="124" text-anchor="end" fill="#fbf6e9">1.56</text>
            <line class="conf-stem" x1="519" y1="130" x2="519" y2="142"></line>
            <circle class="conf-dot" cx="519" cy="144" r="4.5"></circle>
            <text class="chart-sub" x="519" y="158" text-anchor="middle">confidence 0.92</text>

            <text class="chart-label" x="0" y="200">repo-layout / convention</text>
            <text class="chart-sub" x="0" y="218">CLI verbs live in src/cli.js</text>
            <rect class="bar-score" x="270" y="228" width="385" height="22" rx="2"></rect>
            <text class="chart-value" x="647" y="244" text-anchor="end" fill="#fbf6e9">1.42</text>
