<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="decay-title decay-desc"><style>
  .zone { fill: none; stroke: #bdb3a3; stroke-dasharray: 5 6; }
