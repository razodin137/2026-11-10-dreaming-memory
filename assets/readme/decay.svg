  .conf-dot { fill: #f8f4eb; stroke: #191611; stroke-width: 1.3; }
  .conf-stem { stroke: #191611; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<rect x="0" y="0" width="780" height="430" fill="#f8f4eb"/>
            <title id="decay-title">Confidence decay over 200 days</title>
            <desc id="decay-desc">Three notes with zero uses starting at confidence 0.92, 0.74, and 0.66 decline by half every 45 days. A dashed red threshold at 0.05 marks retirement, reached between 167 and 189 days.</desc>

            <rect class="retire-band" x="70" y="354" width="660" height="16"></rect>
            <line class="grid-line" x1="70" y1="50" x2="730" y2="50"></line>
            <line class="grid-line" x1="70" y1="130" x2="730" y2="130"></line>
            <line class="grid-line" x1="70" y1="210" x2="730" y2="210"></line>
            <line class="grid-line" x1="70" y1="290" x2="730" y2="290"></line>
            <line class="axis-line" x1="70" y1="370" x2="730" y2="370"></line>
            <line class="axis-line" x1="70" y1="50" x2="70" y2="370"></line>

            <text class="axis-label" x="62" y="54" text-anchor="end">1.00</text>
            <text class="axis-label" x="62" y="134" text-anchor="end">0.75</text>
            <text class="axis-label" x="62" y="214" text-anchor="end">0.50</text>
            <text class="axis-label" x="62" y="294" text-anchor="end">0.25</text>
            <text class="axis-label" x="62" y="374" text-anchor="end">0.00</text>

            <text class="axis-label" x="70" y="394">0</text>
            <text class="axis-label" x="202" y="394">40</text>
            <text class="axis-label" x="334" y="394">80</text>
            <text class="axis-label" x="466" y="394">120</text>
            <text class="axis-label" x="598" y="394">160</text>
            <text class="axis-label" x="730" y="394" text-anchor="end">200 days</text>

            <line class="retire-line" x1="70" y1="354" x2="730" y2="354"></line>
            <text class="retire-label" x="726" y="348" text-anchor="end">retired below 0.05</text>

            <path class="curve curve-1" d="M70 76 L136 153 L202 211 L268 253 L334 284 L400 307 L466 323 L532 336 L598 345 L664 351 L730 356"></path>
            <path class="curve curve-2" d="M70 133 L136 196 L202 242 L268 276 L334 301 L400 319 L466 333 L532 343 L598 350 L664 355 L730 359"></path>
            <path class="curve curve-3" d="M70 159 L136 215 L202 256 L268 286 L334 308 L400 325 L466 337 L532 345 L598 352 L664 357 L730 360"></path>

            <circle class="curve-dot curve-1" cx="70" cy="76" r="3.5"></circle>
            <circle class="curve-dot curve-2" cx="70" cy="133" r="3.5"></circle>
            <circle class="curve-dot curve-3" cx="70" cy="159" r="3.5"></circle>

            <line x1="70" y1="56" x2="96" y2="56" stroke="#b3482a" stroke-width="2"></line>
            <text class="chart-value" x="104" y="60">0.92</text>
            <line x1="150" y1="56" x2="176" y2="56" stroke="#6e7d66" stroke-width="2"></line>
            <text class="chart-value" x="184" y="60">0.74</text>
            <line x1="230" y1="56" x2="256" y2="56" stroke="#70658c" stroke-width="2"></line>
            <text class="chart-value" x="264" y="60">0.66</text>

            <text class="chart-sub" x="70" y="34">confidence</text>
            <text class="chart-sub" x="730" y="414" text-anchor="end">days since updated_at</text>
          </svg>
